
<!DOCTYPE html>
<html lang="pt" class="scroll-pt-20">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Porta do Caracol - Arquitetura Biónica</title>
    
    <!-- DNS Prefetch & Preconnect para aceleração de rede -->
    <link rel="preconnect" href="https://files.catbox.moe">
    <link rel="preconnect" href="https://i.imgur.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://files.catbox.moe">
    <link rel="dns-prefetch" href="https://i.imgur.com">

    <!-- Preload do Logo (Asset mais importante para branding/LCP) -->
    <link rel="preload" as="image" href="https://i.imgur.com/KEc0hAJ.png" fetchpriority="high">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Model Viewer Script com defer para não bloquear o render -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-F7V3L51CPN"></script>

    <style>
      html { scroll-behavior: smooth; }
      body { font-family: 'Poppins', sans-serif; }
      .font-orbitron { font-family: 'Orbitron', sans-serif; }
      .font-playfair { font-family: 'Playfair Display', serif; }
      
      @keyframes neon-pulse {
        0%, 100% { filter: drop-shadow(0 0 5px #00ffff); }
        50% { filter: drop-shadow(0 0 15px #00ffff); }
      }
      .neon-glow { animation: neon-pulse 2s infinite ease-in-out; }

      @keyframes neon-halo-cyan {
        0%, 100% { 
          text-shadow: 0 0 10px rgba(6, 182, 212, 0.8), 0 0 20px rgba(6, 182, 212, 0.5);
          transform: scale(1);
        }
        50% { 
          text-shadow: 0 0 20px rgba(6, 182, 212, 1), 0 0 50px rgba(6, 182, 212, 0.8);
          transform: scale(1.02);
        }
      }
      
      .animate-neon-halo-night { animation: neon-halo-cyan 3s infinite ease-in-out; }
      .animate-neon-halo-day { animation: neon-halo-teal 3s infinite ease-in-out; }

      @keyframes logo-shimmer {
        0% { filter: brightness(1); transform: translateY(0); }
        50% { filter: brightness(1.4) drop-shadow(0 0 15px rgba(6, 182, 212, 0.6)); transform: translateY(-5px); }
        100% { filter: brightness(1); transform: translateY(0); }
      }
      .logo-shine { animation: logo-shimmer 4s infinite ease-in-out; }
      
      /* Otimização de Imagens de Fundo */
      .bg-optimized {
        background-color: #0b1220;
        background-image: radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.05) 0%, transparent 70%);
      }
    </style>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body class="bg-[#0b1220] text-white overflow-x-hidden bg-optimized">
    <!-- Formulário Oculto para o Netlify Bot -->
    <form name="contact-form" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
